name: Windows

# 功能性 CI：Go 測試與 Windows 編譯、Rust TSF 與候選窗編譯、32 位元 DLL、引擎與 CLI 的 Windows 建置。
# 不覆蓋（由 platforms/windows/test 的腳本與使用者手動驗收補上，見 T29）：
# - TSF 註冊與語言列。
# - WPF、記事本、Terminal、Edge、WebView2、搜尋框的實際輸入。
# - 安裝、升級、回復、解除安裝。
# - 候選窗像素與主題。
# 不需要任何 secret。

on:
  push:
    branches: [main, 'ja/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # Go module 與 build cache，鍵由 go.sum 決定。
          cache: true
      - name: Add the 32-bit Rust target
        run: rustup target add i686-pc-windows-msvc
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/windows/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('platforms/windows/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check public source paths
        shell: pwsh
        run: |
          # Windows 映像的 Python 3 只保證 python，python3 不一定有。
          $python = Get-Command python3 -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command python -ErrorAction Stop }
          & $python.Source scripts/check_public_tree.py
      - name: Test Go code
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee go-test.log
      - name: Vet Go code
        run: go vet ./...
      - name: Build Go code
        run: go build ./...
      - name: Build the Windows engine
        shell: bash
        run: |
          mkdir -p build/windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o build/windows/0c-server.exe ./cmd/0c-server
      - name: Build Rust x64
        shell: bash
        working-directory: platforms/windows
        run: |
          set -o pipefail
          cargo build --release --locked 2>&1 | tee rust-build-x64.log
      - name: Test Rust
        shell: bash
        working-directory: platforms/windows
        run: |
          set -o pipefail
          cargo test --release --locked 2>&1 | tee rust-test.log
      - name: Build the 32-bit TSF DLL
        shell: bash
        working-directory: platforms/windows
        run: |
          set -o pipefail
          cargo build --release --locked --target i686-pc-windows-msvc -p zuin-tsf 2>&1 | tee rust-build-x86.log
      - name: Verify build outputs
        shell: bash
        run: |
          for output in \
            platforms/windows/target/release/0c_tsf.dll \
            platforms/windows/target/release/0c-ui.exe \
            platforms/windows/target/i686-pc-windows-msvc/release/0c_tsf.dll \
            build/windows/0c-server.exe; do
            test -f "$output" || { echo "missing build output: $output" >&2; exit 1; }
          done
      - name: Upload Go test output and Rust build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-logs
          path: |
            go-test.log
            platforms/windows/rust-*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-binaries
          path: |
            platforms/windows/target/release/0c_tsf.dll
            platforms/windows/target/release/0c-ui.exe
            platforms/windows/target/i686-pc-windows-msvc/release/0c_tsf.dll
            build/windows/0c-server.exe
          if-no-files-found: warn
          retention-days: 14

  # 已發佈的注音字典在 Linux 上取得：source_release.verify 會比對檔案 mode，NTFS 沒有執行位元，
  # 在 Windows 上解開的 tarball 一定 inventory 不符。這裡只下載與驗證，不重建 bigram。
  chinese-dictionary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 字典取自已發佈的原始碼 tarball。工作目錄沒有 release tag，所以明確指定版本；
      # 變更 data/dictionary.lock.json 時要同步改成相符的 release。
      DICTIONARY_RELEASE: v0.2.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch the released Chinese dictionary
        run: python3 scripts/fetch_assets.py --release "$DICTIONARY_RELEASE" --no-models
      - name: Upload the Chinese dictionary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chinese-dictionary
          path: assets
          if-no-files-found: error
          retention-days: 7

  # 未簽章的 Windows 預覽包，供人工驗收下載；不安裝、不註冊、不上傳 Release，也不需要 secret。
  preview-bundle:
    needs: chinese-dictionary
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Rust and the Windows targets
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/windows/target
          key: ${{ runner.os }}-cargo-preview-${{ hashFiles('platforms/windows/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # 只取已發佈的注音字典，不從 data/lm 重建中文 bigram。
      - name: Download the released Chinese dictionary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chinese-dictionary
          path: assets
      - name: Compile the Japanese seed pack
        run: go run ./cmd/0c-compile -lang ja -public -out build/ja
      - name: Prepare minimal release docs
        shell: bash
        run: |
          mkdir -p build/preview-docs
          printf '%s\n' 'CI 預覽包：解壓後依 PACKAGING.md 的說明執行 install.ps1。' > build/preview-docs/INSTALL.md
          printf '%s\n' 'CI 預覽包不含使用者資料，執行時也不會上傳任何資料。' > build/preview-docs/PRIVACY.md
          printf '%s\n' 'CI 預覽包以整包替換更新，不提供就地升級。' > build/preview-docs/UPDATING.md
      - name: Build the unsigned preview bundle
        shell: bash
        run: |
          set -euo pipefail
          # package_windows.py 需要 x.y.z 形式的版本；CI 版本用 0.2.0-ci.<sha>，且必須 >= update.FixedSince
          # （0.1.0-dev.62），否則 TSF DLL 註冊會走舊的版本目錄路徑。
          version="0.2.0-ci.$(git rev-parse --short=12 HEAD)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python scripts/package_windows.py --preview --data assets/data --ja-data build/ja \
            --release-docs build/preview-docs --version "$version" --out build/release
      - name: Verify the preview bundle
        shell: bash
        run: |
          python - <<'PY'
          import glob, hashlib, sys, zipfile
          archive, = glob.glob("build/release/*.zip")
          required = [
              "0c-server.exe", "0c-update.exe", "0c-ui.exe", "0c_tsf.dll",
              "x86/0c_tsf.dll", "data/manifest.json", "data/ja/manifest.json",
              "install.ps1", "release.json",
          ]
          with zipfile.ZipFile(archive) as bundle:
              names = bundle.namelist()
              (top,) = {name.split("/", 1)[0] for name in names}
              entries = {name.split("/", 1)[1] for name in names if "/" in name}
              missing = [path for path in required if path not in entries]
              if missing:
                  sys.exit(f"preview bundle is missing: {', '.join(missing)}")
          digest = hashlib.sha256(open(archive, "rb").read()).hexdigest()
          print(f"{archive}: {len(entries)} files in {top}/")
          print(f"SHA-256 {digest}")
          PY
      - name: Upload the preview bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-preview-bundle
          path: |
            build/release/*.zip
            build/release/*.zip.sha256
          if-no-files-found: error
          retention-days: 14

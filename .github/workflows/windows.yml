name: Windows

# Phase 2 功能性 CI（P2-05）：Phase 2 契約套件、Go 測試與 Windows 原生／交叉編譯、
# Rust TSF 與候選窗編譯、32 位元 DLL、引擎與 CLI 的 Windows 建置。
# P2-27B：CI 不跑 ONNX 推論、不下載模型；推論驗證留在 DGX。lock 只驗 schema 與雜湊欄位。
# 正式產品的推論只用 ONNX Runtime；llama.cpp／GGUF／zenz 已由 P2-01 從正式路徑移除，
# 這個 workflow 不建置、不快取、也不下載它們（spike 只留在 scripts/spike/，非產品路徑）。
# 不覆蓋（由 platforms/windows/test 的腳本與使用者手動驗收補上，見 P2-44）：
# - TSF 註冊與語言列。
# - WPF、記事本、Terminal、Edge、WebView2、搜尋框的實際輸入。
# - 安裝、升級、回復、解除安裝。
# - 候選窗像素與主題。
# 不需要任何 secret。

on:
  push:
    branches: [main, 'ja/**', 'p2/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  windows-cgo-native:
    # P2-43：產品出貨的原生 ONNX 後端。Windows 的 cgo 需要 mingw 的 gcc；
    # onnxruntime_go 的 Windows 實作以 cgo 包住 syscall DLL 載入，沒有 gcc 就編不過。
    # 這個 job 只建置與跑測試，不上傳含 Python 的產物。
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install mingw
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Show the C compiler
        shell: bash
        run: gcc --version
      - name: Build the native engine with CGO
        shell: bash
        env:
          CGO_ENABLED: '1'
          CC: gcc
        run: |
          set -o pipefail
          mkdir -p build/windows
          go build -tags onnxruntime -trimpath -ldflags "-X main.buildVersion=ci" \
            -o build/windows/0c-server-native.exe ./cmd/0c-server 2>&1 | tee go-build-cgo.log
      - name: Verify the native backend is compiled in
        shell: bash
        env:
          CGO_ENABLED: '1'
          CC: gcc
        run: |
          test -f build/windows/0c-server-native.exe
          go version -m build/windows/0c-server-native.exe | grep -q 'build.*tags=.*onnxruntime' || echo "tags are not recorded in this Go build"
      - name: Upload CGO build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-cgo-logs
          path: go-build-cgo.log
          if-no-files-found: warn
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # Go module 與 build cache，鍵由 go.sum 決定。
          cache: true
      - name: Add the 32-bit Rust target
        run: rustup target add i686-pc-windows-msvc
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/windows/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('platforms/windows/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check public source paths
        shell: pwsh
        run: |
          # Windows 映像的 Python 3 只保證 python，python3 不一定有。
          $python = Get-Command python3 -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command python -ErrorAction Stop }
          & $python.Source scripts/check_public_tree.py
      - name: Test Phase 2 contracts
        shell: bash
        run: |
          # P2-02 凍結的 profile-free 契約：片段、lattice、語言標籤、scorer、輸出與 session。
          set -o pipefail
          go test -count=1 \
            ./core/segment/... \
            ./core/lattice/... \
            ./core/lang/... \
            ./core/score/... \
            ./core/output/... \
            ./core/session/... 2>&1 | tee go-contract-test.log
      - name: Test Go code
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee go-test.log
      - name: Vet Go code
        run: go vet ./...
      - name: Build Go code
        run: go build ./...
      - name: Build the Windows engine
        shell: bash
        run: |
          mkdir -p build/windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o build/windows/0c-server.exe ./cmd/0c-server
      - name: Check Rust
        shell: bash
        working-directory: platforms/windows
        run: cargo check --locked
      - name: Build Rust x64
        shell: bash
        working-directory: platforms/windows
        run: |
          set -o pipefail
          cargo build --release --locked 2>&1 | tee rust-build-x64.log
      - name: Test Rust
        shell: bash
        working-directory: platforms/windows
        run: |
          set -o pipefail
          cargo test --release --locked 2>&1 | tee rust-test.log
      - name: Build the 32-bit TSF DLL
        shell: bash
        working-directory: platforms/windows
        run: |
          set -o pipefail
          cargo build --release --locked --target i686-pc-windows-msvc -p zuin-tsf 2>&1 | tee rust-build-x86.log
      - name: Verify build outputs
        shell: bash
        run: |
          for output in \
            platforms/windows/target/release/0c_tsf.dll \
            platforms/windows/target/release/0c-ui.exe \
            platforms/windows/target/i686-pc-windows-msvc/release/0c_tsf.dll \
            build/windows/0c-server.exe; do
            test -f "$output" || { echo "missing build output: $output" >&2; exit 1; }
          done
      - name: Upload Go test output and Rust build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-logs
          path: |
            go-contract-test.log
            go-test.log
            platforms/windows/rust-*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-binaries
          path: |
            platforms/windows/target/release/0c_tsf.dll
            platforms/windows/target/release/0c-ui.exe
            platforms/windows/target/i686-pc-windows-msvc/release/0c_tsf.dll
            build/windows/0c-server.exe
          if-no-files-found: warn
          retention-days: 14

  cross-build:
    # Phase 2 完成條件包含 GOOS=windows go build ./...（P2-01、P2-02）。
    # 在 Linux 交叉編譯，與 windows job 的原生建置互補：原生 job 跑測試與 Rust，
    # 這裡確認每個套件在沒有 CGO、沒有 Windows SDK 的情況下也編得過。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Cross-build Windows binaries
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go build ./...
          go vet ./...
          mkdir -p build/windows
          go build -trimpath -o build/windows/0c-server.exe ./cmd/0c-server
          go build -trimpath -o build/windows/0c-cli.exe ./cmd/0c-cli
      - name: Test the Windows packaging rules
        run: |
          python3 -m unittest discover -s scripts -p 'test_windows_package.py'
      - name: Upload the cross-built Windows binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-cross-build
          path: |
            build/windows/0c-server.exe
            build/windows/0c-cli.exe
          if-no-files-found: warn
          retention-days: 14

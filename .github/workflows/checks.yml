name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Check public source paths
        run: python3 scripts/check_public_tree.py
      - name: Validate the model lock schema and hash fields
        # P2-27B：只驗 schema 與雜湊欄位，不連網、不下載、不跑推論。development
        # 模式允許尚未 pin 的 HF revision 並印出警告；release 打包前必須 pin。
        run: go run ./cmd/0c-model-set check -lock models/pairing.lock.json
      - name: Test Go code
        run: go test ./...
      - name: Vet Go code
        run: go vet ./...
      - name: Test Fcitx5 client
        run: make -C platforms/linux-fcitx5 test
      - name: Test upgrades
        run: make test-upgrade
      - name: Test Windows packaging and model-package rules
        run: make test-windows-package
      - name: Test release packaging
        run: make test-release

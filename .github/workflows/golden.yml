name: Golden

# T01：注音行為 baseline。任何快照差異都會讓這個 job 失敗並印出 diff。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: golden-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zhuyin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Compare zhuyin golden baseline
        run: go run ./cmd/0c-golden

name: Windows settings

# P2-47F / P2-50：建置「靈犀注音設定」Windows 版。原本只在 windows.yml 的
# windows-settings job；完整安裝包也需要它，所以抽成可重用的 workflow，兩邊共用同一份
# 建置步驟與產物名稱（windows-settings）。只建置與上傳未簽章產物，簽章與版本資源仍由
# scripts/package_windows.py 在完整套件完成時一起做。
on:
  workflow_call:
    inputs:
      version:
        description: 設定程式顯示的版本，通常與套件版本相同
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-settings:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Show the toolchain versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          python --version
      - name: Build the settings program
        shell: pwsh
        env:
          SETTINGS_VERSION: ${{ inputs.version }}
        run: |
          python scripts/build_settings_windows.py --version $env:SETTINGS_VERSION --out build/settings
      - name: Verify the build outputs
        shell: bash
        run: |
          test -f build/settings/windows-amd64/0c-settings.exe
          test -f build/settings/windows-amd64/NOTICES.txt
          ls -l build/settings/windows-amd64/
      - name: Upload the settings program
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-settings
          path: |
            build/settings/windows-amd64/0c-settings.exe
            build/settings/windows-amd64/NOTICES.txt
          if-no-files-found: error
          retention-days: 14
